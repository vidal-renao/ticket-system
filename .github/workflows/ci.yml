name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - name: npm audit (fails on any critical, or any high beyond the dated known-and-triaged set)
        run: |
          set -euo pipefail
          npm audit --json > audit.json || true
          cat audit.json | node -e '
            const fs = require("fs");
            const audit = JSON.parse(fs.readFileSync("audit.json", "utf8"));
            const vulns = audit.vulnerabilities || {};

            // Dated 2026-07-26: these four share one root cause -- next@15.5.21s
            // pinned optional/nested sharp and postcss copies -- and their only
            // npm-computed fix is `next@9.3.3` (isSemVerMajor: true), an ancient
            // pre-15 downgrade that is explicitly out of scope here (no major
            // upgrades/downgrades, no automated audit-fix). Two attempts at a
            // scoped `overrides` pin were tried and reverted: both destabilized
            // unrelated parts of the eslint dependency tree far more than they
            // fixed. Revisit once Next.js publishes a 15.x patch. Critical-severity
            // findings are never allowed through this list, regardless of name.
            const knownHighWithNoSafeFix = new Set(["next", "postcss", "sharp", "brace-expansion"]);

            let criticalCount = 0;
            const unexpected = [];
            for (const [name, info] of Object.entries(vulns)) {
              if (info.severity === "critical") { criticalCount++; continue; }
              if (info.severity === "high" && !knownHighWithNoSafeFix.has(name)) {
                unexpected.push(name);
              }
            }

            console.log(`critical: ${criticalCount}, high: ${Object.values(vulns).filter(v => v.severity === "high").length} (of which known/triaged: ${[...knownHighWithNoSafeFix].filter(n => vulns[n]).length})`);

            if (criticalCount > 0) {
              console.error("::error::npm audit found " + criticalCount + " critical severity issue(s).");
              process.exit(1);
            }
            if (unexpected.length > 0) {
              console.error("::error::npm audit found new high-severity issue(s) not in the known/triaged list: " + unexpected.join(", "));
              process.exit(1);
            }
            console.log("OK: no critical findings; all high-severity findings are the dated, already-triaged, no-safe-fix set.");
          '

  rag-foundation:
    # Runs the RAG Foundation harness against a disposable PostgreSQL
    # instance provisioned entirely inside this GitHub-hosted runner --
    # never against Supabase Preview Branches (gated behind a paid plan)
    # and never against production. The container is destroyed at the end
    # of the job regardless of outcome (cleanup step uses if: always()).
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Run pure PowerShell unit tests (Preview identity matrix, process-argument quoting) before provisioning anything
        run: |
          pwsh -NoProfile -File scripts/tests/test-preview-identity.ps1
          pwsh -NoProfile -File scripts/tests/test-process-arguments.ps1

      - name: Generate ephemeral database credentials (random, job-scoped, never logged)
        id: creds
        run: |
          set -euo pipefail
          PASSWORD="$(openssl rand -base64 24 | tr -dc 'A-Za-z0-9')"
          echo "::add-mask::$PASSWORD"
          echo "password=$PASSWORD" >> "$GITHUB_OUTPUT"

      - name: Start ephemeral PostgreSQL 17.6 (pinned to production's exact version; loopback-only)
        env:
          PG_EPHEMERAL_PASSWORD: ${{ steps.creds.outputs.password }}
        run: |
          set -euo pipefail
          docker run -d --name rag-ci-postgres \
            -e POSTGRES_PASSWORD="$PG_EPHEMERAL_PASSWORD" \
            -e POSTGRES_USER=postgres \
            -e POSTGRES_DB=postgres \
            -p 127.0.0.1:5432:5432 \
            postgres:17.6
          for _ in $(seq 1 30); do
            if docker exec rag-ci-postgres pg_isready -U postgres >/dev/null 2>&1; then
              exit 0
            fi
            sleep 2
          done
          echo "::error::PostgreSQL did not become ready in time"
          exit 1

      - name: Install pgvector 0.8.x and pgTAP (matches production pgvector 0.8.0; pgTAP is a test-only extension never installed in production)
        run: |
          set -euo pipefail
          docker exec rag-ci-postgres bash -c \
            "apt-get update -qq && apt-get install -y --no-install-recommends postgresql-17-pgvector postgresql-17-pgtap"

      - name: Install psql client on the runner (PGDG repo, pinned to client 17 to match the server; ubuntu-latest's default repo only has an older client)
        run: |
          set -euo pipefail
          sudo apt-get install -y --no-install-recommends curl ca-certificates gnupg
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /usr/share/keyrings/postgresql-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/postgresql-keyring.gpg] http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends postgresql-client-17

      - name: Create the disposable database (name must end in _rag_preview_test)
        env:
          PGPASSWORD: ${{ steps.creds.outputs.password }}
        run: psql --no-psqlrc --set=ON_ERROR_STOP=1 "postgresql://postgres@127.0.0.1:5432/postgres" -c "CREATE DATABASE ci_rag_preview_test;"

      - name: Assert the target host is loopback and is not the production ref (defense in depth, in addition to the harness's own Assert-DisposableTarget)
        run: |
          set -euo pipefail
          HOST="127.0.0.1"
          if [ "$HOST" != "127.0.0.1" ] && [ "$HOST" != "localhost" ] && [ "$HOST" != "::1" ]; then
            echo "::error::Refusing non-loopback host: $HOST"; exit 1
          fi
          if [[ "$HOST" == *"focgfmhgfmhmcbywwsej"* ]]; then
            echo "::error::Production project ref detected in CI database target"; exit 1
          fi
          echo "OK: loopback host, no production ref."

      - name: Run the RAG Foundation harness (real migrations, 100 pgTAP assertions, 3x two-connection concurrency)
        # scripts/test-rag-foundation.ps1 -TargetMode Local already applies
        # supabase/tests/fixtures/rag_legacy_base.sql as its own first step
        # (see the harness's own $files list) -- a separate bootstrap step
        # here would apply it twice and fail on the second attempt
        # ("relation organizations already exists"), which is exactly what
        # the first real run of this job caught.
        env:
          PGPASSWORD: ${{ steps.creds.outputs.password }}
        run: |
          pwsh -NoProfile -File scripts/test-rag-foundation.ps1 \
            -TargetMode Local \
            -DatabaseUrl "postgresql://postgres@127.0.0.1:5432/ci_rag_preview_test"

      - name: Capture read-only structural verification (docs/sql/rag-foundation-verification.sql; no row data, metadata only)
        if: always()
        env:
          PGPASSWORD: ${{ steps.creds.outputs.password }}
        run: |
          psql --no-psqlrc --set=ON_ERROR_STOP=1 \
            "postgresql://postgres@127.0.0.1:5432/ci_rag_preview_test" \
            --file=docs/sql/rag-foundation-verification.sql >> "$GITHUB_STEP_SUMMARY" 2>&1 || true

      - name: Tear down the ephemeral database container
        if: always()
        run: docker rm -f rag-ci-postgres || true

  identity-foundation:
    # Runs the Phase 4A.14 user-identity migration (reference_code,
    # customer_type, logos storage/RLS) and its pgTAP suite against a
    # disposable PostgreSQL instance, same isolation model as rag-foundation:
    # never Supabase Preview Branches, never production, always torn down.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Generate ephemeral database credentials (random, job-scoped, never logged)
        id: creds
        run: |
          set -euo pipefail
          PASSWORD="$(openssl rand -base64 24 | tr -dc 'A-Za-z0-9')"
          echo "::add-mask::$PASSWORD"
          echo "password=$PASSWORD" >> "$GITHUB_OUTPUT"

      - name: Start ephemeral PostgreSQL 17.6 (pinned to production's exact version; loopback-only)
        env:
          PG_EPHEMERAL_PASSWORD: ${{ steps.creds.outputs.password }}
        run: |
          set -euo pipefail
          docker run -d --name identity-ci-postgres \
            -e POSTGRES_PASSWORD="$PG_EPHEMERAL_PASSWORD" \
            -e POSTGRES_USER=postgres \
            -e POSTGRES_DB=postgres \
            -p 127.0.0.1:5433:5432 \
            postgres:17.6
          for _ in $(seq 1 30); do
            if docker exec identity-ci-postgres pg_isready -U postgres >/dev/null 2>&1; then
              exit 0
            fi
            sleep 2
          done
          echo "::error::PostgreSQL did not become ready in time"
          exit 1

      - name: Install pgTAP (test-only extension, never installed in production)
        run: |
          set -euo pipefail
          docker exec identity-ci-postgres bash -c \
            "apt-get update -qq && apt-get install -y --no-install-recommends postgresql-17-pgtap"

      - name: Install psql client on the runner (PGDG repo, pinned to client 17 to match the server)
        run: |
          set -euo pipefail
          sudo apt-get install -y --no-install-recommends curl ca-certificates gnupg
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /usr/share/keyrings/postgresql-keyring-identity.gpg
          echo "deb [signed-by=/usr/share/keyrings/postgresql-keyring-identity.gpg] http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg-identity.list
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends postgresql-client-17

      - name: Create the disposable database (name must end in _identity_ci_test)
        env:
          PGPASSWORD: ${{ steps.creds.outputs.password }}
        run: psql --no-psqlrc --set=ON_ERROR_STOP=1 "postgresql://postgres@127.0.0.1:5433/postgres" -c "CREATE DATABASE ci_identity_ci_test;"

      - name: Assert the target host is loopback and is not the production ref (defense in depth)
        run: |
          set -euo pipefail
          HOST="127.0.0.1"
          if [ "$HOST" != "127.0.0.1" ] && [ "$HOST" != "localhost" ] && [ "$HOST" != "::1" ]; then
            echo "::error::Refusing non-loopback host: $HOST"; exit 1
          fi
          if [[ "$HOST" == *"focgfmhgfmhmcbywwsej"* ]]; then
            echo "::error::Production project ref detected in CI database target"; exit 1
          fi
          echo "OK: loopback host, no production ref."

      - name: Apply legacy fixture, the identity migration, then run the pgTAP suite
        env:
          PGPASSWORD: ${{ steps.creds.outputs.password }}
        run: |
          set -euo pipefail
          DB_URL="postgresql://postgres@127.0.0.1:5433/ci_identity_ci_test"
          psql --no-psqlrc --set=ON_ERROR_STOP=1 "$DB_URL" --file=supabase/tests/fixtures/identity_legacy_base.sql
          psql --no-psqlrc --set=ON_ERROR_STOP=1 "$DB_URL" --file=supabase/migrations/202607270001_user_identity_onboarding.sql
          psql --no-psqlrc --set=ON_ERROR_STOP=1 "$DB_URL" --file=supabase/migrations/202607270002_user_identity_backfill_organization.sql
          psql --no-psqlrc --set=ON_ERROR_STOP=1 "$DB_URL" --file=supabase/tests/user_identity.sql | tee identity-pgtap.log
          # psql prefixes NOTICE/output lines with leading whitespace, so
          # "not ok" must be matched without anchoring to column 0 (a bug
          # caught here in real CI: an earlier ^not ok anchor let 3 real
          # pgTAP failures through as a green job).
          if grep -qE "not ok [0-9]" identity-pgtap.log; then
            echo "::error::pgTAP reported at least one failed assertion"
            grep -E "not ok [0-9]|# Failed test" identity-pgtap.log
            exit 1
          fi
          if ! grep -qE "^\s*1\.\.[0-9]+\s*$" identity-pgtap.log; then
            echo "::error::No pgTAP plan line found -- the suite may not have run at all"
            exit 1
          fi
          echo "OK: pgTAP plan line found and no failed assertions."

      - name: Publish pgTAP summary
        if: always()
        run: cat identity-pgtap.log >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true

      - name: Tear down the ephemeral database container
        if: always()
        run: docker rm -f identity-ci-postgres || true
